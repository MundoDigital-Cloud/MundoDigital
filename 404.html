:root{--bg:#070b1a;--text:#f2f6ff;--muted:#9db0de;--line:#22305f;--blue:#2f8bff;--cyan:#00d4ff;--glow:rgba(47,139,255,.45)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f7ff;--text:#0f1b3d;--muted:#4b5a80;--line:#d3e0fb;--glow:rgba(47,139,255,.3)}}
:root[data-theme="light"]{--bg:#f3f7ff;--text:#0f1b3d;--muted:#4b5a80;--line:#d3e0fb;--glow:rgba(47,139,255,.3)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 0,#12449e55,transparent 60%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;overflow-x:hidden;position:relative}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;background:#1f6feb;width:300px;height:300px;top:-60px;right:6%;animation:drift 12s ease-in-out infinite alternate;pointer-events:none}
@keyframes drift{to{transform:translate(40px,30px) scale(1.2)}}
.logo{position:absolute;top:18px;left:18px;display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font-weight:800}
.logo img{width:42px;height:42px;border-radius:50%}
.bot{position:relative;margin-top:40px}
.bot::before{content:"";position:absolute;inset:10% 0;background:radial-gradient(circle,var(--glow),transparent 66%);animation:glow 3s ease-in-out infinite alternate}
@keyframes glow{to{transform:scale(1.2);opacity:.6}}
.bot img{position:relative;max-height:300px;max-width:70vw;height:auto;filter:drop-shadow(0 14px 28px rgba(0,0,0,.5));animation:sway 4.5s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) translateY(-6px)}}
h1{font-size:clamp(4rem,16vw,8rem);margin:6px 0 0;line-height:1;font-weight:900;background:linear-gradient(90deg,var(--blue),var(--cyan),var(--blue));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:200% center}}
h2{margin:4px 0 8px;font-size:clamp(1.3rem,4vw,1.8rem)}
p{color:var(--muted);max-width:460px;margin:0 auto 22px}
.btn{display:inline-block;background:linear-gradient(90deg,var(--blue),var(--cyan));color:#fff;font-weight:800;padding:13px 26px;border-radius:999px;text-decoration:none;margin:4px;transition:transform .2s}
.btn:hover{transform:translateY(-2px) scale(1.03)}
.btn.alt{background:transparent;color:var(--text);border:2px solid var(--line)}
small{display:block;margin-top:26px;color:var(--muted)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
